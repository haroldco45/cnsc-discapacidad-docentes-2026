name: Robot de noticias y fotos
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "robot/**"
      - ".github/workflows/robot.yml"
permissions:
  contents: write
concurrency:
  group: robot
  cancel-in-progress: false
jobs:
  robot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python robot/robot.py
      - name: Guardar cambios (solo si hay novedades)
        run: |
          git config user.name "robot-vibras"
          git config user.email "robot-vibras@users.noreply.github.com"
          git add -A noticias.json img og-image.jpg
          if git diff --cached --quiet; then echo "Sin novedades"; exit 0; fi
          git commit -m "Robot: noticias y fotos $(TZ=America/Bogota date '+%Y-%m-%d %H:%M') COT"
          git pull --rebase origin main
          git push
